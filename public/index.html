<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SafeTalk AI</title>
</head>
<body>
  <h1>SafeTalk AI</h1>

  <button id="recordBtn">Start Recording</button>
  <p id="status"></p>

  <p><strong>Transcribed Text:</strong></p>
  <pre id="transcript"></pre>

  <p><strong>Reply:</strong></p>
  <pre id="reply"></pre>

  <audio id="audioPlayer" controls></audio>

  <script>
    let mediaRecorder;
    let audioChunks = [];

    const recordBtn = document.getElementById("recordBtn");
    const statusText = document.getElementById("status");
    const transcriptDiv = document.getElementById("transcript");
    const replyDiv = document.getElementById("reply");
    const audioPlayer = document.getElementById("audioPlayer");

    recordBtn.onclick = async () => {
      if (!mediaRecorder || mediaRecorder.state === "inactive") {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);

        mediaRecorder.onstop = async () => {
          const audioBlob = new Blob(audioChunks, { type: "audio/webm" });
          audioChunks = [];

          const formData = new FormData();
          formData.append("file", audioBlob, "recording.webm");

          statusText.innerText = "Processing...";

          try {
            const res = await fetch("http://localhost:8000/api/process-audio", {
              method: "POST",
              body: formData
            });

            const data = await res.json();

            transcriptDiv.innerText = data.text || "";
            replyDiv.innerText = data.reply || "";
            if (data.audio_url) {
              audioPlayer.src = "http://localhost:8000" + data.audio_url;
              audioPlayer.load();
            }
            statusText.innerText = "Done";
          } catch (err) {
            console.error(err);
            statusText.innerText = "Error";
          }
        };

        mediaRecorder.start();
        recordBtn.innerText = "Stop Recording";
      } else {
        mediaRecorder.stop();
        recordBtn.innerText = "Start Recording";
      }
    };
  </script>
</body>
</html>
